data:
  raw_root: "data/sequences"   # relative to pc2d/; override with $PC2D_RAW_ROOT
  processed_root: "data/processed"  # relative to pc2d/; override with $PC2D_PROCESSED_ROOT
  train_seqs: [0, 1, 2, 3, 4, 5, 6, 7]
  val_seqs: [8]
  shard_size: 200
  num_workers: 0

model:
  name: "range_image_unet"
  h: 64
  w: 2048
  device: auto      # auto | cuda | cpu ; auto = cuda if available else cpu; override with $PC2D_DEVICE
  precision: fp16   # fp32 | fp16 ; fp16 enables autocast + GradScaler on cuda; override with $PC2D_PRECISION
  fov_top_deg: 2.0
  fov_bottom_deg: -24.8
  in_channels: 5
  base_channels: 32
  num_classes: 5
  use_groupnorm: true
  groups: 8

train:
  optimizer: "adamw"
  lr: 5.0e-4
  weight_decay: 1.0e-4
  batch_size: 2
  grad_accum_steps: 4
  max_range: 80.0
  min_range: 2.0
  epochs: 100
  patience: 15
  val_every_steps: 500
  warmup_steps: 500
  grad_clip: 5.0

  loss:
    ce_weight: 1.0
    lovasz_weight: 0.5

  augmentation:
    random_flip_h: true
    random_flip_h_prob: 0.5
    intensity_jitter: true
    intensity_jitter_prob: 0.3
    intensity_jitter_std: 0.05
    cutout: true
    cutout_prob: 0.3
    cutout_h: 16
    cutout_w: 256

checkpoint:
  dir: "checkpoints"  # relative to pc2d/; override with $PC2D_CKPT_DIR
  best_name: "best_miou.pt"
  last_name: "last.pt"
