[project]
name = "pc2d"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141.1",
  "numpy>=2.5.2",
  "onnx>=1.16.0",
  "onnxruntime>=1.18.0",
  "onnxscript>=0.1.0",
  "matplotlib>=3.8.0",
  "numba>=0.67.0; python_version >= '3.14'",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.3",
  "scipy>=1.18.1",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "triton-windows>=3.8,<3.9; sys_platform == 'win32'",
  "uvicorn[standard]>=0.52.4",
  "webdataset>=1.0.2",
  "psutil>=7.2.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
